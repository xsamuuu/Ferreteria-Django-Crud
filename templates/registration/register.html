{% extends 'base.html' %}

{% block title %}Registrarse - Ferretería El Tornillo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h3 class="mb-3">Crear Cuenta</h3>
            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-grid gap-2">
                    <button class="btn btn-primary-custom" type="submit">Registrarse</button>
                </div>
            </form>
            <div class="mt-3 text-center">
                <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
